     dots r=59.75 at the same centers. -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960">
  <circle cx="479.5" cy="479.5" r="467.5" fill="#ffffff"/>
  <path fill="#000000" d="M 479.5 12
    A 467.5 467.5 0 0 1 479.5 947
    L 479.5 935.8
    A 228.3 228.3 0 0 1 479.5 479.2
    L 479.5 479.8
    A 228.3 228.3 0 0 0 479.5 23.2
    L 479.5 12 Z"/>
  <circle cx="479.5" cy="251.5" r="59.75" fill="#000000"/>
  <circle cx="479.5" cy="707.5" r="59.75" fill="#ffffff"/>
  <circle cx="479.5" cy="479.5" r="461.5" fill="none" stroke="#000000" stroke-width="12"/>
</svg>
